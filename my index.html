<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Developer Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar">
        <div class="logo">Manas.Dev</div>
        <button id="themeBtn">Toggle Theme 🌙</button>
    </nav>

    <main class="dashboard-container">
        
        <div class="dashboard-card weather-card">
            <h3>🌤️ Weather Station</h3>
            <p>Fetch live weather insights via open API analytics.</p>
            <button id="weatherBtn">Get Live Weather</button>
            <div id="weatherDisplay" class="output-area"></div>
        </div>

        <div class="dashboard-card game-card">
            <h3>🎮 Lucky Number Game</h3>
            <p>Guess the secret number between 1 and 10.</p>
            <input type="number" id="userGuess" min="1" max="10" placeholder="1-10">
            <button id="gameBtn">Check Guess</button>
            <p id="gameResult" class="output-area"></p>
        </div>

        <div class="dashboard-card form-card">
            <h3>📩 System Inquiry</h3>
            <form id="dashboardForm">
                <label for="name">Name:</label>
                <input type="text" id="name" placeholder="Your Name">

                <label for="email">Email:</label>
                <input type="email" id="email" placeholder="Your Email">

                <label for="interest">Domain Area:</label>
                <select id="interest">
                    <option value="tech">Machine Learning & AI</option>
                    <option value="vlog">Content Creation</option>
                    <option value="dev">Full-Stack Development</option>
                </select>

                <button type="submit" id="submitBtn">Deploy Message</button>
            </form>
        </div>

    </main>

    <script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta  name="viewport" content="width=device-width, initial-scale=1.0">
        <title>My personal hub</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <header class="main-header">
            <h1>Welcome to My Space</h1>
            <p>Tech Enthusiast | Student | Content creator</p>
        </header>
        <main class="peoject- container">
            <h2 class="section-title">What I Do</h2>

            <div class="card-grid">
                <div class="project-card">
                    <h3>development</h3>
                    <p>Writing clean code in python, C,and building interactive web layouts.</p>
                </div>
                <div class="project-card">
                    <h3>Analytics & Strategy</h3>
                    <p>Tracking insights,  managingb channel metrics, and learing systems.</p>
                </div>
            </div>
        </main>
        <section  class="form-section">
            <h2 class="section-title">Let's Connect</h2>
            <form action="#" method="POST" class="portfolio-form">
                <label for="name">Name:</label>
                <input type="text" id="name" placeholde="Your Name" required>

                <label for="email">email:</label>
                <input type="email" id="email" placeholde="Your Email" required>
                
                <label for="interest">Primery Interest:</label>
                <select id="interest" name="interest">
                    <option value="tech">Technology & Coding</option>
                    <option value="vlog">Vloging & media</option>
                    <option value="other">Other</option>
                </select>
                <label for="msg">Message:</label>
                <textarea id="msg" row="4" placeholder="Drop a message..."></textarea>

                <input type="submit" value="send Message">
            </form>
        </section> 
    </body>
</html>
